<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("bw:theme"))||"midnight"}catch(e){document.documentElement.dataset.theme="midnight"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030304">
  <meta property="og:site_name" content="Blackwaves">
  <meta property="og:image" content="/assets/img/icon-512.png">
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico?v=3">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400&display=swap">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <title>Browser | Blackwaves</title>
  <meta name="description" content="Browse the web in Blackwaves with a sidebar of tabs.">
  <meta property="og:title" content="Browser | Blackwaves">
  <meta property="og:description" content="Browse the web in Blackwaves with a sidebar of tabs.">

</head>
<body data-page="browser">
  <div class="browser-shell">
    <aside class="browser-rail" id="browser-rail" aria-label="Tabs">
      <div class="rail-brand">
        <img src="/assets/img/logo.svg" alt="">
        <span>blackwaves</span>
      </div>
      <div class="rail-label">Tabs</div>
      <div class="rail-tabs" id="rail-tabs" role="tablist" aria-label="Open tabs"></div>
      <div class="rail-foot">
        <button class="btn" id="new-tab" type="button"><svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#plus"/></svg> New tab</button>
        <a class="btn" href="/"><svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#house"/></svg> Home</a>
        <button class="btn" id="browser-settings" type="button"><svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#gear"/></svg> Settings</button>
        <p class="note" id="browser-ping">Connecting&hellip;</p>
      </div>
    </aside>

    <div class="browser-main">
      <div class="browser-bar">
        <button class="icon-btn" id="b-back" type="button" title="Back" aria-label="Back"><svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#arrow-left"/></svg></button>
        <button class="icon-btn" id="b-forward" type="button" title="Forward" aria-label="Forward"><svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#arrow-right"/></svg></button>
        <button class="icon-btn" id="b-reload" type="button" title="Reload" aria-label="Reload"><svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#rotate-right"/></svg></button>
        <form class="field" id="b-form">
          <svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#lock"/></svg>
          <input class="input" id="b-url" type="text" placeholder="Search the web or enter a URL" autocomplete="off" spellcheck="false" aria-label="Address">
        </form>
        <button class="icon-btn" id="b-home" type="button" title="Home" aria-label="Home"><svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#house"/></svg></button>
        <button class="icon-btn" id="b-close-tab" type="button" title="Close tab" aria-label="Close tab"><svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#xmark"/></svg></button>
      </div>
      <div class="browser-views" id="browser-views">
        <div class="browser-blank" id="browser-blank">
          <img class="home-mark" src="/assets/img/mark.svg" alt="" width="92" height="92">
          <h1 class="wordmark">blackwaves</h1>
          <p class="tagline">Browse freely. Play anything.</p>
          <form class="home-search" id="blank-search" role="search">
            <div class="field">
              <svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#magnifying-glass"/></svg>
              <input class="input" id="blank-query" type="text" placeholder="Search the web or enter a URL" autocomplete="off" spellcheck="false" aria-label="Search the web or enter a URL">
            </div>
          </form>
          <div class="quick">
            <a class="btn" href="/games.html"><svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#gamepad"/></svg> Games</a>
            <a class="btn" href="/movies.html"><svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#film"/></svg> Movies</a>
            <a class="btn" href="/apps.html"><svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#grip"/></svg> Apps</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/baremux/index.js"></script>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/core.js"></script>
  <script src="/assets/js/atmosphere.js"></script>
  <script src="/assets/js/proxy.js"></script>
  <script src="/assets/js/browser.js"></script>
</body>
</html>
