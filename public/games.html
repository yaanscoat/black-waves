<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("bw:theme"))||"midnight"}catch(e){document.documentElement.dataset.theme="midnight"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030304">
  <meta property="og:site_name" content="Blackwaves">
  <meta property="og:image" content="/assets/img/icon-512.png">
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico?v=3">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400&display=swap">
  <link rel="stylesheet" href="/assets/css/main.css">
  <title>Games | Blackwaves</title>
  <meta name="description" content="Hundreds of unblocked games on Blackwaves.">
  <meta property="og:title" content="Games | Blackwaves">
  <meta property="og:description" content="Hundreds of unblocked games on Blackwaves.">

</head>
<body data-page="games">
  <main class="page">
    <div class="page-head">
      <div>
        <h1>Games</h1>
        <p id="games-count">Loading the library&hellip;</p>
      </div>
      <div class="toolbar">
        <div class="field">
          <svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#magnifying-glass"/></svg>
          <input class="input" id="games-search" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games">
        </div>
        <button class="btn" id="games-random" type="button"><svg class="i" aria-hidden="true"><use href="/assets/img/icons.svg#shuffle"/></svg> Random</button>
      </div>
    </div>
    <section id="recent-section" hidden>
      <div class="section-label">Recently played</div>
      <div class="grid" id="recent-grid"></div>
      <div class="section-label">All games</div>
    </section>
    <div class="vgrid" id="games-grid"><div class="grid" id="games-window"></div></div>
  </main>
  <footer class="site-footer"><span>Games from the <a href="https://github.com/gmshelf/ckv" target="_blank" rel="noopener">CKV</a> collection</span></footer>
  <script src="/baremux/index.js"></script>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script src="/assets/js/core.js"></script>
  <script src="/assets/js/atmosphere.js"></script>
  <script src="/assets/js/proxy.js"></script>
  <script src="/assets/js/games.js"></script>
</body>
</html>
